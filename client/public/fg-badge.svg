<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 52" fill="none">
  <defs>
    <!-- Premium Emerald-to-Blue Corporate Gradient -->
    <linearGradient id="badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Soft Drop Shadow for Badge -->
    <filter id="badge-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#badge-shadow)">
    <!-- Rounded Rectangle Badge -->
    <rect x="2" y="2" width="48" height="48" rx="12" fill="url(#badge-grad)" />

    <!-- Bold, Clean "FG" Letters -->
    <text
      x="26"
      y="34"
      font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="900"
      font-size="25"
      letter-spacing="-0.5"
      fill="#FFFFFF"
      text-anchor="middle"
    >
      FG
    </text>

    <!-- Accent dot -->
    <circle cx="40" cy="11" r="2.5" fill="#34D399" />
  </g>
</svg>
