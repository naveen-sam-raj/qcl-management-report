<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 52" fill="none">
  <defs>
    <!-- Premium Emerald-to-Blue Corporate Gradient -->
    <linearGradient id="fg-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="45%" stop-color="#059669" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Text Accent Gradient for 'GROUP' -->
    <linearGradient id="fg-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Soft Drop Shadow for Badge -->
    <filter id="fg-soft-shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- ── Left: Bold, Clean "FG" Monogram Tile ── -->
  <g filter="url(#fg-soft-shadow)">
    <!-- Rounded Rectangle Badge -->
    <rect x="2" y="2" width="48" height="48" rx="12" fill="url(#fg-badge-grad)" />

    <!-- Bold, Clean "FG" Letters -->
    <text
      x="26"
      y="34"
      font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
      font-weight="900"
      font-size="25"
      letter-spacing="-0.5"
      fill="#FFFFFF"
      text-anchor="middle"
    >
      FG
    </text>

    <!-- Subtle accent leaf dot at top right -->
    <circle cx="40" cy="11" r="2.5" fill="#34D399" />
  </g>

  <!-- ── Right: Clear Corporate Brand Name ── -->
  <!-- "FERTILIZER" -->
  <text
    x="62"
    y="27"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="21"
    letter-spacing="1.2"
    fill="#0F172A"
  >
    FERTILIZER
  </text>

  <!-- "GROUP" -->
  <text
    x="202"
    y="27"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="900"
    font-size="21"
    letter-spacing="1.2"
    fill="url(#fg-text-grad)"
  >
    GROUP
  </text>

  <!-- Member Plants Subtitle -->
  <text
    x="63"
    y="43"
    font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-weight="800"
    font-size="9"
    letter-spacing="2.8"
    fill="#64748B"
  >
    SPIC • TFL • GREENSTAR
  </text>
</svg>
